<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hem-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="metal-shaft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="50%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="260" cy="330" rx="160" ry="22" fill="#e2e8f0" />

  <!-- Motor Body Cylindrical Core -->
  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Base mounting feet -->
    <rect x="180" y="270" width="50" height="20" rx="3" fill="#14532d" />
    <rect x="290" y="270" width="50" height="20" rx="3" fill="#14532d" />

    <!-- Back Fan Cover (Cowl) -->
    <rect x="330" y="110" width="50" height="170" rx="15" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <!-- Vent slits on Cowl -->
    <g fill="#1e293b">
      <rect x="345" y="125" width="20" height="6" rx="2" />
      <rect x="345" y="140" width="20" height="6" rx="2" />
      <rect x="345" y="155" width="20" height="6" rx="2" />
      <rect x="345" y="170" width="20" height="6" rx="2" />
      <rect x="345" y="185" width="20" height="6" rx="2" />
      <rect x="345" y="200" width="20" height="6" rx="2" />
      <rect x="345" y="215" width="20" height="6" rx="2" />
      <rect x="345" y="230" width="20" height="6" rx="2" />
      <rect x="345" y="245" width="20" height="6" rx="2" />
      <rect x="345" y="260" width="20" height="6" rx="2" />
    </g>

    <!-- Main Stator Frame -->
    <rect x="140" y="100" width="200" height="190" rx="10" fill="url(#hem-body)" stroke="#14532d" stroke-width="2" />

    <!-- Cooling Fins -->
    <g fill="#14532d" opacity="0.45">
      <rect x="150" y="115" width="180" height="8" rx="2" />
      <rect x="150" y="130" width="180" height="8" rx="2" />
      <rect x="150" y="145" width="180" height="8" rx="2" />
      <rect x="150" y="160" width="180" height="8" rx="2" />
      <rect x="150" y="175" width="180" height="8" rx="2" />
      <rect x="150" y="190" width="180" height="8" rx="2" />
      <rect x="150" y="205" width="180" height="8" rx="2" />
      <rect x="150" y="220" width="180" height="8" rx="2" />
      <rect x="150" y="235" width="180" height="8" rx="2" />
      <rect x="150" y="250" width="180" height="8" rx="2" />
      <rect x="150" y="265" width="180" height="8" rx="2" />
    </g>

    <!-- Front Endshield -->
    <ellipse cx="140" cy="195" rx="20" ry="95" fill="#166534" stroke="#14532d" stroke-width="2" />
    <ellipse cx="140" cy="195" rx="10" ry="45" fill="#14532d" />

    <!-- Rotor Shaft extending from Front -->
    <rect x="60" y="180" width="80" height="30" rx="3" fill="url(#metal-shaft)" stroke="#475569" stroke-width="1.5" />
    <rect x="80" y="180" width="40" height="6" fill="#1e293b" />

    <!-- Terminal Box on Top -->
    <rect x="190" y="60" width="90" height="50" rx="4" fill="#166534" stroke="#14532d" stroke-width="2" />
    <polygon points="190,60 210,40 280,40 280,60" fill="#14532d" stroke="#14532d" stroke-width="2" />
    <circle cx="245" cy="50" r="6" fill="#1e293b" />
  </g>
</svg>
