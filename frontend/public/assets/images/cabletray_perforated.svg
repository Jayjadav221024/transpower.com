<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.12" />
    </filter>
    <linearGradient id="grey-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="320" rx="160" ry="20" fill="#f1f5f9" />

  <!-- Isometric Perforated Channels (2 parallel trays) -->
  <g transform="translate(100, 80)" filter="url(#shadow)">
    
    <!-- Channel 1 (Left Tray) -->
    <g transform="translate(0, 30)">
      <!-- Left side wall -->
      <path d="M 0,170 L 0,140 L 220,10 L 220,40 Z" fill="#475569" stroke="#334155" stroke-width="1" />
      <!-- Base plate -->
      <path d="M 0,170 L 220,40 L 255,65 L 35,195 Z" fill="url(#grey-metal)" stroke="#475569" stroke-width="1" />
      <!-- Right side wall -->
      <path d="M 35,195 L 35,165 L 255,35 L 255,65 Z" fill="#64748b" stroke="#334155" stroke-width="1" />

      <!-- Punch holes (Perforations pattern on base) -->
      <g fill="#1e293b" opacity="0.6">
        <circle cx="20" cy="165" r="2" />
        <circle cx="50" cy="145" r="2" />
        <circle cx="80" cy="125" r="2" />
        <circle cx="110" cy="105" r="2" />
        <circle cx="140" cy="85" r="2" />
        <circle cx="170" cy="65" r="2" />
        <circle cx="200" cy="45" r="2" />

        <circle cx="28" cy="172" r="2" />
        <circle cx="58" cy="152" r="2" />
        <circle cx="88" cy="132" r="2" />
        <circle cx="118" cy="112" r="2" />
        <circle cx="148" cy="92" r="2" />
        <circle cx="178" cy="72" r="2" />
        <circle cx="208" cy="52" r="2" />
      </g>
    </g>

    <!-- Channel 2 (Right Tray, offset slightly) -->
    <g transform="translate(60, 0)">
      <!-- Left side wall -->
      <path d="M 0,170 L 0,140 L 220,10 L 220,40 Z" fill="#475569" stroke="#334155" stroke-width="1" />
      <!-- Base plate -->
      <path d="M 0,170 L 220,40 L 255,65 L 35,195 Z" fill="url(#grey-metal)" stroke="#475569" stroke-width="1" />
      <!-- Right side wall -->
      <path d="M 35,195 L 35,165 L 255,35 L 255,65 Z" fill="#64748b" stroke="#334155" stroke-width="1" />

      <!-- Punch holes (Perforations pattern on base) -->
      <g fill="#1e293b" opacity="0.6">
        <circle cx="20" cy="165" r="2" />
        <circle cx="50" cy="145" r="2" />
        <circle cx="80" cy="125" r="2" />
        <circle cx="110" cy="105" r="2" />
        <circle cx="140" cy="85" r="2" />
        <circle cx="170" cy="65" r="2" />
        <circle cx="200" cy="45" r="2" />

        <circle cx="28" cy="172" r="2" />
        <circle cx="58" cy="152" r="2" />
        <circle cx="88" cy="132" r="2" />
        <circle cx="118" cy="112" r="2" />
        <circle cx="148" cy="92" r="2" />
        <circle cx="178" cy="72" r="2" />
        <circle cx="208" cy="52" r="2" />
      </g>
    </g>
  </g>
</svg>
