<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="50%" stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background base shadow -->
  <ellipse cx="250" cy="350" rx="180" ry="25" fill="#e2e8f0" />

  <!-- Main Enclosure -->
  <rect x="110" y="80" width="280" height="250" rx="8" fill="url(#body-grad)" filter="url(#shadow)" stroke="#4b5563" stroke-width="3" />
  
  <!-- Outer Frame Highlights -->
  <rect x="120" y="90" width="260" height="230" rx="6" fill="none" stroke="#6b7280" stroke-width="1" stroke-opacity="0.5" />

  <!-- Top Ventilations -->
  <g fill="#111827">
    <rect x="135" y="100" width="45" height="10" rx="2" />
    <rect x="195" y="100" width="45" height="10" rx="2" />
    <rect x="255" y="100" width="45" height="10" rx="2" />
    <rect x="315" y="100" width="45" height="10" rx="2" />
  </g>

  <!-- Front Steel Panel Overlay -->
  <rect x="130" y="125" width="240" height="185" rx="4" fill="#4b5563" stroke="#9ca3af" stroke-width="2" />
  <rect x="135" y="130" width="230" height="175" rx="3" fill="#1f2937" />

  <!-- Digital Controller Unit -->
  <rect x="150" y="145" width="110" height="65" rx="4" fill="#0b0f19" stroke="#374151" stroke-width="2" />
  <rect x="155" y="150" width="100" height="40" rx="2" fill="url(#screen-grad)" />
  <!-- Text inside screen simulating parameters -->
  <text x="162" y="165" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="bold">415 V  50Hz</text>
  <text x="162" y="180" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">I = 3200 A</text>
  <!-- Screen LED Indicators -->
  <circle cx="160" cy="200" r="3" fill="#10b981" />
  <circle cx="172" cy="200" r="3" fill="#ef4444" />
  <circle cx="184" cy="200" r="3" fill="#f59e0b" />
  <text x="195" y="203" fill="#9ca3af" font-family="sans-serif" font-size="8">SYS OK</text>

  <!-- Large Charging Handle / Lever -->
  <g filter="url(#shadow)">
    <!-- Base -->
    <rect x="285" y="145" width="60" height="65" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="2" />
    <!-- Metal Shaft -->
    <path d="M 305,210 L 305,170 C 305,160 325,160 325,170 L 325,210 Z" fill="url(#metal-grad)" />
    <!-- Handle Grip -->
    <rect x="295" y="200" width="40" height="15" rx="3" fill="#ef4444" stroke="#b91c1c" stroke-width="1" />
  </g>

  <!-- Push Buttons (ON/OFF) -->
  <!-- OFF Button (Red) -->
  <g transform="translate(150, 235)">
    <rect x="0" y="0" width="50" height="40" rx="5" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <circle cx="25" cy="20" r="10" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="15" y="38" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="7">PUSH OFF</text>
  </g>

  <!-- ON Button (Green) -->
  <g transform="translate(210, 235)">
    <rect x="0" y="0" width="50" height="40" rx="5" fill="#16a34a" stroke="#166534" stroke-width="2" />
    <line x1="25" y1="12" x2="25" y2="28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <text x="17" y="38" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="7">PUSH ON</text>
  </g>

  <!-- Draw-out Position Indicator & Status flag -->
  <g transform="translate(285, 235)">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <!-- Flags -->
    <rect x="8" y="10" width="20" height="12" rx="2" fill="#ef4444" />
    <text x="11" y="19" fill="#fff" font-family="sans-serif" font-size="7" font-weight="bold">TRIP</text>

    <rect x="32" y="10" width="20" height="12" rx="2" fill="#eab308" />
    <text x="34" y="19" fill="#000" font-family="sans-serif" font-size="6" font-weight="bold">READY</text>

    <text x="12" y="34" fill="#9ca3af" font-family="sans-serif" font-size="8">BREAKER STATUS</text>
  </g>
</svg>
