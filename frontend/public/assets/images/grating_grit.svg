<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="orange-grid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="320" rx="170" ry="25" fill="#f1f5f9" />

  <!-- Isometric Grit Grid Design -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- Base Plate Outline -->
    <path d="M 150,0 L 300,75 L 150,150 L 0,75 Z" fill="url(#orange-grid)" stroke="#7c2d12" stroke-width="2" />
    
    <!-- Grid Cells -->
    <path d="M 30,15 L 180,90 M 60,30 L 210,105 M 90,45 L 240,120 M 120,60 L 270,135" stroke="#7c2d12" stroke-width="3" fill="none" />
    <path d="M 30,135 L 180,60 M 60,120 L 210,45 M 90,105 L 240,30 M 120,90 L 270,15" stroke="#7c2d12" stroke-width="3" fill="none" />

    <!-- Quartz Grit Texture (Dots/Sprinkles along the grid ribs) -->
    <g fill="#fdba74" opacity="0.9">
      <circle cx="45" cy="25" r="1.5" />
      <circle cx="50" cy="35" r="1.2" />
      <circle cx="80" cy="40" r="1.5" />
      <circle cx="95" cy="55" r="1" />
      <circle cx="110" cy="50" r="1.5" />
      
      <circle cx="140" cy="80" r="1.3" />
      <circle cx="155" cy="95" r="1.5" />
      <circle cx="170" cy="85" r="1" />
      
      <circle cx="210" cy="110" r="1.5" />
      <circle cx="225" cy="120" r="1.2" />
      <circle cx="240" cy="115" r="1.5" />

      <circle cx="65" cy="85" r="1.5" />
      <circle cx="80" cy="100" r="1" />
      <circle cx="115" cy="115" r="1.6" />
      <circle cx="125" cy="125" r="1.2" />
    </g>

    <!-- Side Thickness -->
    <path d="M 0,75 L 0,90 L 150,165 L 150,150 Z" fill="#c2410c" stroke="#7c2d12" stroke-width="1.5" />
    <path d="M 150,150 L 150,165 L 300,90 L 300,75 Z" fill="#7c2d12" stroke="#7c2d12" stroke-width="1.5" />
  </g>
</svg>
