<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mcb-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="toggle-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="toggle-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="250" cy="340" rx="150" ry="18" fill="#e2e8f0" />

  <!-- 3-Pole MCB Module Enclosure -->
  <g id="triple-mcb" filter="url(#shadow)">
    <!-- Pole 1 -->
    <g transform="translate(130, 80)">
      <rect x="0" y="0" width="75" height="230" rx="4" fill="url(#mcb-body)" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="0" y1="40" x2="75" y2="40" stroke="#cbd5e1" stroke-width="1" />
      <line x1="0" y1="190" x2="75" y2="190" stroke="#cbd5e1" stroke-width="1" />
      
      <!-- Top screw terminal hole -->
      <circle cx="37.5" cy="20" r="10" fill="#475569" />
      <circle cx="37.5" cy="20" r="7" fill="#1e293b" />
      <rect x="35" y="15" width="5" height="10" fill="#94a3b8" />

      <!-- Toggle housing -->
      <rect x="15" y="65" width="45" height="90" rx="4" fill="#64748b" stroke="#475569" stroke-width="1" />
      <!-- Toggle Lever (ON - UP position) -->
      <path d="M 20,110 L 55,110 L 50,75 L 25,75 Z" fill="url(#toggle-orange)" />
      <text x="32" y="130" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="8">I-ON</text>

      <!-- Indicator window (Green/Red) -->
      <rect x="22" y="165" width="31" height="15" rx="2" fill="#ef4444" stroke="#991b1b" stroke-width="1" />
      <circle cx="28" cy="172.5" r="3" fill="#fff" />
    </g>

    <!-- Pole 2 -->
    <g transform="translate(205, 80)">
      <rect x="0" y="0" width="75" height="230" rx="4" fill="url(#mcb-body)" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="0" y1="40" x2="75" y2="40" stroke="#cbd5e1" stroke-width="1" />
      <line x1="0" y1="190" x2="75" y2="190" stroke="#cbd5e1" stroke-width="1" />

      <!-- Top screw terminal hole -->
      <circle cx="37.5" cy="20" r="10" fill="#475569" />
      <circle cx="37.5" cy="20" r="7" fill="#1e293b" />
      <rect x="35" y="15" width="5" height="10" fill="#94a3b8" />

      <!-- Toggle housing -->
      <rect x="15" y="65" width="45" height="90" rx="4" fill="#64748b" stroke="#475569" stroke-width="1" />
      <!-- Toggle Lever (ON - UP position) -->
      <path d="M 20,110 L 55,110 L 50,75 L 25,75 Z" fill="url(#toggle-orange)" />
      <text x="32" y="130" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="8">I-ON</text>

      <!-- Indicator window (Green/Red) -->
      <rect x="22" y="165" width="31" height="15" rx="2" fill="#ef4444" stroke="#991b1b" stroke-width="1" />
      <circle cx="28" cy="172.5" r="3" fill="#fff" />
    </g>

    <!-- Pole 3 -->
    <g transform="translate(280, 80)">
      <rect x="0" y="0" width="75" height="230" rx="4" fill="url(#mcb-body)" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="0" y1="40" x2="75" y2="40" stroke="#cbd5e1" stroke-width="1" />
      <line x1="0" y1="190" x2="75" y2="190" stroke="#cbd5e1" stroke-width="1" />

      <!-- Top screw terminal hole -->
      <circle cx="37.5" cy="20" r="10" fill="#475569" />
      <circle cx="37.5" cy="20" r="7" fill="#1e293b" />
      <rect x="35" y="15" width="5" height="10" fill="#94a3b8" />

      <!-- Toggle housing -->
      <rect x="15" y="65" width="45" height="90" rx="4" fill="#64748b" stroke="#475569" stroke-width="1" />
      <!-- Toggle Lever (OFF - DOWN position) -->
      <path d="M 20,110 L 55,110 L 50,145 L 25,145 Z" fill="url(#toggle-green)" />
      <text x="30" y="90" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="8">O-OFF</text>

      <!-- Indicator window (Green/Red) -->
      <rect x="22" y="165" width="31" height="15" rx="2" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <circle cx="28" cy="172.5" r="3" fill="#fff" />
    </g>

    <!-- Connecting Trip Bar across the toggles -->
    <rect x="155" y="90" width="180" height="10" rx="2" fill="#1e293b" opacity="0.9" />

    <!-- Spec Brand Printing -->
    <text x="145" y="225" fill="#1e293b" font-family="sans-serif" font-weight="bold" font-size="9">TRANSPOWER C16</text>
    <text x="145" y="240" fill="#64748b" font-family="sans-serif" font-size="8">240V/415V ~ 10000A</text>
    <!-- ISI Certification Mark -->
    <rect x="320" y="215" width="22" height="25" rx="2" fill="none" stroke="#dc2626" stroke-width="1" />
    <text x="323" y="230" fill="#dc2626" font-family="sans-serif" font-weight="bold" font-size="8">ISI</text>
  </g>
</svg>
