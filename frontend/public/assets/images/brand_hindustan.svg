<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="450" height="100">
  <rect width="100%" height="100%" fill="transparent"/>
  <!-- H Logo Icon -->
  <g transform="translate(15, 12)">
    {/* Left red bar */}
    <rect x="0" y="0" width="14" height="76" fill="#e11d48" rx="2" />
    {/* Right black bar */}
    <rect x="26" y="0" width="14" height="76" fill="#0f172a" rx="2" />
    {/* Middle bar connection */}
    <rect x="14" y="28" width="12" height="20" fill="#e11d48" />
    {/* Left horizontal notch notches */}
    <rect x="0" y="16" width="22" height="10" fill="#e11d48" />
    <rect x="18" y="50" width="22" height="10" fill="#0f172a" />
  </g>
  <!-- Text -->
  <text x="75" y="46" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" fill="#e11d48" font-size="44" letter-spacing="-1.5">hindustan</text>
  <text x="77" y="74" font-family="'Montserrat', 'Arial', sans-serif" font-weight="900" fill="#0f172a" font-size="18" letter-spacing="3.5">ELECTRIC MOTORS</text>
