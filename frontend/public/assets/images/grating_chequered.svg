<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="chequered-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="320" rx="170" ry="25" fill="#f1f5f9" />

  <!-- Isometric Solid Chequered Design -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- Base Plate Outline (Solid top surface) -->
    <path d="M 150,0 L 300,75 L 150,150 L 0,75 Z" fill="url(#chequered-yellow)" stroke="#b45309" stroke-width="2" />
    
    <!-- Chequered Tread Patterns (Diagonal Hatching Lines) -->
    <!-- We draw small isometric diamond hashes on the surface to look like real metal tread plate -->
    <g stroke="#fef3c7" stroke-width="2" opacity="0.6">
      <path d="M 50,25 L 60,30" />
      <path d="M 80,40 L 90,45" />
      <path d="M 110,55 L 120,60" />
      <path d="M 140,70 L 150,75" />
      
      <path d="M 60,65 L 70,70" />
      <path d="M 90,80 L 100,85" />
      <path d="M 120,95 L 130,100" />
      
      <path d="M 170,40 L 180,45" />
      <path d="M 200,55 L 210,60" />
      <path d="M 230,70 L 240,75" />

      <!-- Opposing direction hashes -->
      <path d="M 50,55 L 40,60" stroke="#d97706" />
      <path d="M 80,70 L 70,75" stroke="#d97706" />
      <path d="M 110,85 L 100,90" stroke="#d97706" />

      <path d="M 180,75 L 170,80" stroke="#d97706" />
      <path d="M 210,90 L 200,95" stroke="#d97706" />
    </g>

    <!-- Side Solid Thickness and Grid Frame Support visible underneath -->
    <path d="M 0,75 L 0,90 L 150,165 L 150,150 Z" fill="#d97706" stroke="#b45309" stroke-width="1.5" />
    <path d="M 150,150 L 150,165 L 300,90 L 300,75 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5" />

    <!-- Grid support structures underneath -->
    <path d="M 30,90 L 30,105 M 60,105 L 60,120 M 90,120 L 90,135 M 120,135 L 120,150" stroke="#92400e" stroke-width="2.5" />
  </g>
</svg>
