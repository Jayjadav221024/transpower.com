<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="yellow-grid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="320" rx="170" ry="25" fill="#f1f5f9" />

  <!-- Isometric Meniscus Grid Design -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- Base Plate Outline -->
    <path d="M 150,0 L 300,75 L 150,150 L 0,75 Z" fill="url(#yellow-grid)" stroke="#92400e" stroke-width="2" />
    
    <!-- Grid Cells (Drawing isometric grid lines) -->
    <!-- Row lines -->
    <path d="M 30,15 L 180,90 M 60,30 L 210,105 M 90,45 L 240,120 M 120,60 L 270,135" stroke="#92400e" stroke-width="3" fill="none" />
    <!-- Column lines -->
    <path d="M 30,135 L 180,60 M 60,120 L 210,45 M 90,105 L 240,30 M 120,90 L 270,15" stroke="#92400e" stroke-width="3" fill="none" />

    <!-- Meniscus Effect (Concave top highlights inside cells) -->
    <!-- We draw small inner shadows or curved lines to simulate concave top surfaces -->
    <g stroke="#fef3c7" stroke-width="1.5" fill="none" opacity="0.8">
      <!-- Curves inside individual square grids -->
      <path d="M 40,30 Q 50,35 60,30" />
      <path d="M 70,45 Q 80,50 90,45" />
      <path d="M 100,60 Q 110,65 120,60" />
      
      <path d="M 40,110 Q 50,115 60,110" />
      <path d="M 70,95 Q 80,100 90,95" />
      <path d="M 100,80 Q 110,85 120,80" />
      
      <path d="M 160,90 Q 170,95 180,90" />
      <path d="M 190,105 Q 200,110 210,105" />
      <path d="M 220,120 Q 230,125 240,120" />
    </g>

    <!-- Side Thickness (Extrusion) -->
    <path d="M 0,75 L 0,90 L 150,165 L 150,150 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5" />
    <path d="M 150,150 L 150,165 L 300,90 L 300,75 Z" fill="#78350f" stroke="#78350f" stroke-width="1.5" />
  </g>
</svg>
