<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="grey-gearbox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="blue-motor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="250" cy="320" rx="160" ry="20" fill="#f1f5f9" />

  <!-- Gearbox and Motor Assembly -->
  <g transform="translate(80, 80)" filter="url(#shadow)">
    <!-- Motor part attached to Gearbox (Right Side) -->
    <g transform="translate(160, 40)">
      <!-- Motor Cylindrical frame -->
      <rect x="0" y="20" width="120" height="90" rx="6" fill="url(#blue-motor)" stroke="#1d4ed8" stroke-width="1.5" />
      <!-- Cooling Fins on Motor -->
      <g fill="#1e3a8a" opacity="0.3">
        <rect x="10" y="30" width="100" height="4" rx="1" />
        <rect x="10" y="42" width="100" height="4" rx="1" />
        <rect x="10" y="54" width="100" height="4" rx="1" />
        <rect x="10" y="66" width="100" height="4" rx="1" />
        <rect x="10" y="78" width="100" height="4" rx="1" />
        <rect x="10" y="90" width="100" height="4" rx="1" />
      </g>
      <!-- Motor Fan Cowl (Blue/Black) -->
      <rect x="120" y="25" width="25" height="80" rx="8" fill="#1e293b" />
      <!-- Terminal box on motor -->
      <rect x="30" y="5" width="40" height="20" rx="2" fill="#1d4ed8" />
    </g>

    <!-- Gearbox Monobloc Housing (Left Side) -->
    <g transform="translate(20, 30)">
      <!-- Main gearbox block -->
      <rect x="30" y="50" width="120" height="130" rx="10" fill="url(#grey-gearbox)" stroke="#64748b" stroke-width="2" />
      
      <!-- Detachable Output Flange (Circular casing in middle) -->
      <circle cx="90" cy="115" r="45" fill="#94a3b8" stroke="#475569" stroke-width="2" />
      
      <!-- Hollow shaft output center hole -->
      <circle cx="90" cy="115" r="22" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <!-- Keyway slot in hollow shaft -->
      <rect x="86" y="93" width="8" height="8" fill="#cbd5e1" />

      <!-- Bolts on Flange ring -->
      <g fill="#475569">
        <circle cx="90" cy="80" r="3" />
        <circle cx="125" cy="115" r="3" />
        <circle cx="90" cy="150" r="3" />
        <circle cx="55" cy="115" r="3" />
        <circle cx="115" cy="90" r="3" />
        <circle cx="115" cy="140" r="3" />
        <circle cx="65" cy="90" r="3" />
        <circle cx="65" cy="140" r="3" />
      </g>

      <!-- Mounting foot / base support -->
      <rect x="20" y="175" width="140" height="15" rx="3" fill="#64748b" stroke="#475569" stroke-width="1.5" />

      <!-- Rotomotive Spec Plate -->
      <rect x="70" y="60" width="40" height="12" fill="#3b82f6" />
      <text x="73" y="69" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="7">ROBUS</text>
    </g>
  </g>
</svg>
